<div class="container d-flex justify-content-center align-items-center min-vh-100"> 
    <div class="signup-card">
      <div class="header text-center">
        <h3>Join GOT</h3>
        <p>Create your account to start learning</p>
      </div>

      <form class="p-4">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Gmail</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your Gmail address" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
        </div>

        <div class="mb-3">
          <label for="birthday" class="form-label">Birthday</label>
          <input type="date" id="birthday" class="form-control" required>
        </div>

        <div class="mb-4">
          <label class="form-label d-block">Gender</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="gender" id="female" value="female">
              <label class="form-check-label" for="female">Female</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      </form>

      <div class="footer text-center py-3">
        <p>Already have an account? <a href="signin.html" class="link">Sign in</a></p>
      </div>
    </div>
  </div>
